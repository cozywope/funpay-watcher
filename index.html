:root[data-theme="dark"]{--bg:#0e1124;--surf:#171b36;--ink:#eceefc;--mut:#9aa0c8;--line:#2b3160;--acc:#7b86ff;--on:#0e1124;--ok:#3ddc9a;--soft:#222850;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 clamp(22px,4vw,34px)/1.15 Unbounded,Onest,system-ui,sans-serif;margin:8px 0 20px;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--mut);font-size:14px;min-height:32px}

.tile{position:relative;aspect-ratio:1/1;border-radius:22px 22px 22px 6px;background:var(--surf);border:2px solid var(--line);color:var(--ink);text-align:left;padding:14px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}

.tile span{font:600 18px/1.2 Onest,sans-serif;position:relative}
.tile:hover{transform:translateY(-3px);border-color:var(--acc);background:var(--soft)}
.tile{transition:transform .15s}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.cat{background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:18px 16px;text-align:left;font-weight:600;font-size:17px}
.cat:hover{border-color:var(--acc);background:var(--soft)}
.saved{margin-top:32px}
.saved h2{font:600 16px Onest,sans-serif;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.sv{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;background:var(--surf);overflow:hidden}
.sv button{background:none;border:0;padding:7px 12px}

.lay{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}

.g:last-of-type{border-bottom:0}
.g label{display:block;font-weight:600;font-size:14px;margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 11px;font-size:14px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.rg{display:flex;align-items:center;gap:8px;color:var(--mut)}
.rg input{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit}
.reset{width:100%;margin-top:6px;background:none;border:1.5px dashed var(--line);border-radius:10px;padding:8px;color:var(--mut)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar #cnt{font-weight:600;margin-right:auto}

.tg{font-size:12.5px;background:var(--soft);border-radius:7px;padding:2px 8px}

.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}

.pr{grid-row:1/3;grid-column:2;text-align:right;align-self:center;font:700 20px Unbounded,Onest,sans-serif;white-space:nowrap}
.pr small{display:block;font:400 12px Onest,sans-serif;color:var(--mut)}
.empty{padding:32px 16px;text-align:center;color:var(--mut);border:1.5px dashed var(--line);border-radius:14px}
.note{margin-top:20px;font-size:13px;color:var(--mut)}
.bar0{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.themes{display:flex;gap:6px}

.thp h3{font:600 13px Onest,sans-serif;margin:4px 0 8px;color:var(--mut)}
.thg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;margin-bottom:12px}
.thg button{justify-content:flex-start;text-align:left}
.themes button{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surf);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px}
.themes button.on{border-color:var(--acc);background:var(--soft)}
.themes i{width:18px;height:18px;border-radius:50%;border:1px solid var(--line)}
.pv{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-bottom:10px}
.pv button{border:1.5px solid var(--line);background:var(--surf);border-radius:999px;padding:4px 12px;font-size:13px}
.pv button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.lf{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.adm{border:1.5px solid var(--acc);background:var(--soft);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600}
.act{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));margin-top:14px;z-index:5}
.act button{min-height:48px;padding:0 22px;border-radius:12px;font-weight:700;font-size:16px;border:0;margin-left:auto}
.go{background:var(--acc);color:var(--on)}
.stop{background:var(--soft);color:var(--ink);border:1.5px solid var(--acc)!important}
.rn{color:var(--ok);font-size:14px}
body.ph main{max-width:400px}
body.ph .lay{grid-template-columns:1fr}
body.ph .thp{width:100%}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
.mh{font:600 18px Onest,sans-serif;margin:28px 0 12px}
.mb{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px;min-height:40px}
.ma{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-self:center}
#sort,#save,#cnt{display:none}
@media (max-width:520px){.it{grid-template-columns:1fr}.ma{justify-content:flex-start}}

function startSearch(){if(S.busy)return;var f=S.f,url=(URLS[S.game]||{})[S.cat],ex=[],pl=null,desc=[];
 if(!url){say(ERRM.bad_url);return}
 function ak(t){return ATTR[S.game+"|"+S.cat+"|"+t]}
 schema().forEach(function(t){var o=typeof t==="string"?{k:t}:t,k=o.k;
  if(k==="platform"&&f.platform!=="Все"){desc.push(f.platform);var a=ak("Платформа");if(a)ex.push([a,f.platform]);else pl=f.platform}
  else if(k==="method"&&f.method!=="Все"){desc.push(f.method);var m=ak("Способ получения");if(m)ex.push([m,f.method])}
  else if(k.indexOf("g_")===0&&f[k]!=="Все"){desc.push(f[k]);var g=ak(o.t);if(g)ex.push([g,f[k]])}});
 var p={game:gm().n,category:S.cat,section_url:url,platform:pl,deal_type:f.type,skins_min:f.sMin,skins_max:f.sMax,price_min:f.pMin,price_max:f.pMax,online:f.online,deliv:f.deliv,extra:ex,name:gm().n+" · "+S.cat+(desc.length?" · "+desc.slice(0,3).join(", "):"")};
 S.busy=true;api("save",{p:p}).then(function(r){S.busy=false;if(r.ok){S.curId=r.id;drawAct();loadMine()}else say(ERRM[r.error]||("Ошибка: "+r.error))})}
function stopSearch(){if(!S.curId)return;var id=S.curId;api("toggle",{id:id,on:false}).then(function(r){if(r.ok){S.curId=null;drawAct();loadMine()}else say(ERRM[r.error]||"Ошибка")})}
function adminView(){S.game=S.cat=null;crumbs();app.innerHTML='<h1>Админ-панель</h1><div id="admbox" class="empty">Загрузка…</div>';api("admin").then(function(r){var b=$("#admbox");if(b)b.innerHTML=r.ok?"Пользователей: "+r.users+"<br>Активных поисков: "+r.active+"<br><br>Остальные функции добавим позже.":"Нет доступа"})}
function tgInit(n){n=n||0;api("me").then(function(r){if(r.ok){S.admin=!!r.admin;drawPv();loadMine()}else if(n<3){setTimeout(function(){tgInit(n+1)},1500*(n+1))}})}
var u0="";try{u0=localStorage.getItem("doska-ui")||""}catch(e){}
theme(u0);
home();tgInit();
</script>
</body>
</html>
