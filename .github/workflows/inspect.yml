name: inspect-funpay
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Ссылка на раздел FunPay"
        required: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download page
        env:
          URL: ${{ inputs.url }}
        run: |
          curl -s -o page.html -w "HTTP status: %{http_code}\n" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -H "Accept-Language: ru-RU,ru;q=0.9" \
            "$URL"
          python3 - <<'PY'
          h = open("page.html", encoding="utf-8", errors="replace").read()
          i = h.find("tc-item")
          print("page length:", len(h))
          if i >= 0:
              print(h[max(0, i - 200): i + 2500])
          else:
              print("tc-item not found. Start of page:")
              print(h[:1500])
          PY
