name: scan-funpay
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Ссылки на разделы Аккаунты (по одной на игру), через пробел"
        required: true
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Scan
        env:
          URLS: ${{ inputs.urls }}
        run: python scan.py $URLS
      - name: Save result
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          git add funpay_scan.json
          git commit -m "scan result" || echo "nothing to commit"
          git push
